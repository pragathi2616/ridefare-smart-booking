<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RideFare · Feedback</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<div class="topbar"><div class="brand"><span class="dot"></span> RideFare</div><div class="nav-links"><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('history') }}">History</a><a href="{{ url_for('complaints') }}">Support</a><a href="{{ url_for('profile') }}">Profile</a><a href="{{ url_for('logout') }}">Log out</a></div></div>
<main class="page"><section class="card compact-card"><span class="eyebrow">RIDE #{{ ride[0] }}</span><h1>How was your ride?</h1><p class="subtitle">{{ ride[2] }} → {{ ride[3] }} · {{ ride[1] }} · ₹{{ ride[4] }}</p>
<form method="POST" class="stack"><div class="rating-grid">{% for n in range(1,6) %}<label class="rating-option"><input type="radio" name="rating" value="{{ n }}" {% if feedback and feedback[0]==n %}checked{% endif %} required><span>{{ n }} ★</span></label>{% endfor %}</div>
<div class="form-field"><label for="comment">Comments (optional)</label><textarea id="comment" name="comment" rows="5" maxlength="500" placeholder="Tell us what went well or what could be improved.">{{ feedback[1] if feedback else '' }}</textarea></div><button class="btn block" type="submit">Save feedback</button></form></section></main></body></html>
